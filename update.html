<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>万万同学 软件更新中心</title>

<link rel="icon" href="assets/favicon.png">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

color:white;

background:#050505;

}



.background{

position:fixed;

inset:0;

background:

radial-gradient(
circle at top,
rgba(99,102,241,.35),
transparent 40%
),

radial-gradient(
circle at bottom,
rgba(168,85,247,.25),
transparent 45%
);

z-index:-1;

}





.container{

max-width:760px;

margin:auto;

padding:70px 20px;

}





.header{

text-align:center;

}



.logo{

width:90px;

height:90px;

border-radius:24px;

object-fit:cover;

}




h1{

font-size:36px;

margin:20px 0 10px;

}



.subtitle{

color:#aaa;

font-size:18px;

}



.english{

margin-top:18px;

font-size:11px;

letter-spacing:5px;

color:#666;

}




.card{

margin-top:40px;

padding:28px;


background:

rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.12);


backdrop-filter:blur(20px);


border-radius:26px;

}





.version{

display:flex;

justify-content:space-between;

align-items:center;

}



.version h2{

margin:0;

font-size:24px;

}




.tag{

background:

linear-gradient(
135deg,
#3b82f6,
#8b5cf6
);

padding:5px 12px;

border-radius:999px;

font-size:12px;

}




.time{

margin-top:15px;

color:#aaa;

}




.line{

height:1px;

background:rgba(255,255,255,.12);

margin:25px 0;

}





.content{

color:#ddd;

line-height:1.9;

}





.download{

display:block;

margin-top:30px;

padding:15px;

text-align:center;

border-radius:18px;

text-decoration:none;

color:white;

font-weight:700;


background:

linear-gradient(
135deg,
#2563eb,
#7c3aed
);


}




.loading{

text-align:center;

color:#aaa;

padding:40px;

}




.back{

display:block;

text-align:center;

margin-top:30px;

color:#888;

}



footer{

text-align:center;

margin-top:50px;

color:#666;

font-size:14px;

}


</style>

</head>




<body>


<div class="background"></div>


<div class="container">



<div class="header">


<img src="assets/logo.png" class="logo">


<h1>
软件更新中心
</h1>


<div class="subtitle">
万万同学 Dola
</div>


<div class="english">
SOFTWARE UPDATE CENTER
</div>


</div>





<div class="card" id="update">


<div class="loading">
正在获取最新版本...
</div>


</div>




<a class="back" href="index.html">
返回首页
</a>




<footer>

仅限万万同学内部客户使用

<br>

© 2026 万万同学

</footer>



</div>






<script>


fetch("update.json")


.then(res=>res.json())


.then(data=>{


document.getElementById("update").innerHTML = `



<div class="version">


<h2>

${data.title}

</h2>



<div class="tag">

最新版

</div>


</div>




<div class="time">

发布时间：
${data.date}

</div>




<div class="line"></div>




<div class="content">

${data.content
.map(item=>"• "+item)
.join("<br>")}

</div>




<a class="download"

href="${data.download}"

target="_blank">

立即下载 Windows版

</a>



`;



})


.catch(()=>{


document.getElementById("update").innerHTML = `


<div class="loading">

获取更新失败，请稍后重试

</div>


`;



});


</script>



</body>

</html>
