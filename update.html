<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>万万同学 软件更新中心</title>

<link rel="icon" href="assets/favicon.png">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    color:white;

    background:#050505;
}

.background{
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at top,
        rgba(99,102,241,.35),
        transparent 40%
    ),
    radial-gradient(
        circle at bottom,
        rgba(168,85,247,.25),
        transparent 45%
    );

    z-index:-1;
}

.container{
    max-width:760px;
    margin:auto;
    padding:70px 20px;
}

.header{
    text-align:center;
}

.logo{
    width:90px;
    height:90px;

    border-radius:24px;

    object-fit:cover;
}

h1{
    font-size:36px;
    margin:20px 0 10px;
}

.subtitle{
    color:#aaa;
    font-size:18px;
}

.english{
    margin-top:18px;

    font-size:11px;

    letter-spacing:5px;

    color:#666;
}

.card{
    margin-top:40px;

    padding:28px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    border-radius:26px;
}

.version{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;
}

.version h2{
    margin:0;

    font-size:24px;
}

.tag{
    flex-shrink:0;

    background:
    linear-gradient(
        135deg,
        #3b82f6,
        #8b5cf6
    );

    padding:5px 12px;

    border-radius:999px;

    font-size:12px;
}

.time{
    margin-top:15px;

    color:#aaa;
}

.line{
    height:1px;

    background:
    rgba(255,255,255,.12);

    margin:25px 0;
}

.content{
    color:#ddd;

    line-height:1.9;
}


/* 下载按钮区域 */

.download-area{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:12px;

    margin-top:30px;
}


/* GitHub下载 */

.download{
    display:flex;

    align-items:center;

    justify-content:center;

    min-height:50px;

    padding:14px;

    text-align:center;

    border-radius:16px;

    text-decoration:none;

    color:white;

    font-weight:700;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    border:
    1px solid rgba(255,255,255,.15);

    transition:.25s;
}


/* 夸克网盘 */

.quark-download{
    display:flex;

    align-items:center;

    justify-content:center;

    min-height:50px;

    padding:14px;

    text-align:center;

    border-radius:16px;

    text-decoration:none;

    color:white;

    font-weight:700;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.16);

    transition:.25s;
}

.download:hover,
.quark-download:hover{
    transform:translateY(-3px);
}

.quark-download:hover{
    background:
    rgba(255,255,255,.13);
}

.loading{
    text-align:center;

    color:#aaa;

    padding:40px;
}

.back{
    display:block;

    text-align:center;

    margin-top:30px;

    color:#888;

    text-decoration:none;
}

footer{
    text-align:center;

    margin-top:50px;

    color:#666;

    font-size:14px;
}


@media(max-width:600px){

    .download-area{
        grid-template-columns:1fr;
    }

    .version{
        align-items:flex-start;
    }

    .version h2{
        font-size:20px;
    }

}

</style>

</head>


<body>


<div class="background"></div>


<div class="container">


<div class="header">

<img src="assets/logo.png" class="logo" alt="万万同学">

<h1>
软件更新中心
</h1>

<div class="subtitle">
万万同学 Dola
</div>

<div class="english">
SOFTWARE UPDATE CENTER
</div>

</div>



<div class="card" id="update">

<div class="loading">
正在获取最新版本...
</div>

</div>



<a class="back" href="index.html">
返回首页
</a>


<footer>

仅限万万同学内部客户使用

<br>

© 2026 万万同学

</footer>


</div>



<script>

fetch("update.json")

.then(res => {

    if(!res.ok){
        throw new Error("update.json 请求失败");
    }

    return res.json();

})

.then(data => {

    const content = Array.isArray(data.content)
        ? data.content.map(item => "• " + item).join("<br>")
        : "暂无更新说明";


    document.getElementById("update").innerHTML = `

        <div class="version">

            <h2>
                ${data.title}
            </h2>

            <div class="tag">
                最新版
            </div>

        </div>


        <div class="time">
            发布时间：${data.date}
        </div>


        <div class="line"></div>


        <div class="content">
            ${content}
        </div>


        <div class="download-area">

            <a
                class="download"
                href="${data.download}"
                target="_blank"
            >
                GitHub 直链下载
            </a>


            <a
                class="quark-download"
                href="${data.quark}"
                target="_blank"
            >
                夸克网盘下载
            </a>

        </div>

    `;

})

.catch(error => {

    console.error(error);

    document.getElementById("update").innerHTML = `

        <div class="loading">
            获取更新失败，请稍后重试
        </div>

    `;

});

</script>


</body>

</html>
